# nr-bridge: DEFAULT settings for the DLSS 5 Neural Rendering bridge.
#
# With the installer (nr-bridge-setup.exe) this file lives in the central home (%LOCALAPPDATA%\nr-bridge) and only SEEDS
# a game's own settings file, games\<exe>.cfg, when that game is enabled. Each game then has a complete, independent
# copy: tune a game in ITS file ("Game settings" in the installer), which also starts with notes specific to that game.
# Editing this file changes the defaults for games enabled LATER, nothing else.
#
# Without the installer (standalone: this file next to the DLL in the game folder) this file is the live settings.
#
# Either way the file is watched while the game runs: save it and the new values apply within a second, or press F9.
# Everything can be changed live except mode, ngx, app_match and any_app.
enabled=1

# direct  = the bridge runs DLSS 5 Neural Rendering itself on its own D3D12 device (no ReShade, no RenoDX)
# reshade = route the eyes through a hidden swap chain so ReShade + the RenoDX add-on process them
mode=direct

# Neural Rendering work resolution as a fraction of the eye-pair size, 0.25 .. 1.0.
# In direct mode with residual=1 the full-resolution frame is kept and only the model's edit is
# upsampled, so 0.6 keeps the detail sharp while costing about a third of full resolution.
# The model's cost is per pixel: about 4 ms per megapixel per pass on an RTX 5060 Ti.
scale=0.6
residual=1

# fovea: fraction of each eye (width and height) around the centre that the full-quality passes process.
# Pixels the model sees = fovea^2 * scale^2 of the eye pair, times passes.
fovea=0.6
# fovea_shape: ellipse (inscribed in the fovea box; far less visible than a rectangle) or rect
fovea_shape=ellipse
# feather: width in pixels of the fade inside the fovea edge (smoothstep). Wider = less visible.
feather=400
# outer_scale: > 0 runs ONE extra cheap pass over the WHOLE eye pair at this scale, so the area outside the
# fovea gets the same lighting and tone treatment and the fovea edge becomes a detail-only transition.
# Cost = outer_scale^2 x the eye pair, once: 0.25 = 6% (about 1.8 ms), 0.3 = 9% (about 2.6 ms). 0 = off.
outer_scale=0.25
# outer_pack: 1 = the outer eye pair is packed next to the fovea crops in ONE work texture, so the first pass is a
# single model evaluate covering both tiers (measured: each extra evaluate costs ~1.5 ms on top of its pixels);
# passes 2+ then run on the fovea block alone, exactly as before. The atlas pads where the outer strip is shorter
# than the fovea crops (about 12% at fovea 0.6 / scale 0.6 / outer 0.25), so the net gain is under 1 ms; compare
# the "model" ms in the log against outer_pack=0 (separate textures and a separate outer instance, for A/B).
outer_pack=1
# viewport_ref: for games whose eye rect changes size every frame (adaptive / dynamic resolution). The model is sized
# ONCE for this fraction of the largest rect, so its cost is constant and the game's adaptive loop stays stable.
# 1.0 = full size. If the log line written every 600 frames says "viewport 65% of max", set 0.65 to stop paying for
# pixels the game is not rendering; the game then gets that GPU time back. Does nothing for games with a fixed eye size.
viewport_ref=1.0

# motion vectors from head rotation between frames (direct mode). 0 = zero vectors (reproduces the smear).
# mv_sign=-1 flips the convention if motion looks worse with vectors on than off.
mv=1
mv_sign=1
mv_scale=1.0

# constant depth handed to the model (Unity games give no depth buffer)
depth_value=0.5

# model tuning, same meaning as the RenoDX panel (intensity 0..1, style 0/1/2 = model A/B/C, preset 0 = default)
intensity=1.0
local_structure=1.0
local_tone=1.0
skin_structure=-1
style=0
preset=0
auto_mask=1

# model passes per frame. Each pass is its own model instance fed the previous pass's output, which is
# what deepens face/skin detail (the RenoDX monitor setup used 2-3). Cost multiplies by the pass count.
passes=1

# NGX path: auto (driver core first, then the model DLL through the forwarder) | core | snippet | none (debug passthrough)
ngx=auto

# virtual-key codes: F10 (0x79) toggles the effect for A/B, F9 (0x78) forces a reload of this file. 0 = none.
toggle_vk=0x79
reload_vk=0x78
# Standalone install only: activate when the game exe name contains this text (any_app=1 = every OpenXR app).
# With the installer a game's games\<exe>.cfg is what enables it and this key is left blank.
app_match=BONELAB
any_app=0
# reshade-mode debugging only
window_visible=0
skip_present=0
# frames to log in detail
log_frames=3
